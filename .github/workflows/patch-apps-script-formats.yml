name: Patch GMAC Apps Script Formats

on:
  push:
    paths:
      - scripts/patch-apps-script-formats.mjs
      - .github/workflows/patch-apps-script-formats.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch tournament format engine source
        run: node scripts/patch-apps-script-formats.mjs
      - name: Commit synchronized Apps Script source
        run: |
          git config user.name "GMAC Format Bot"
          git config user.email "actions@users.noreply.github.com"
          git add google-sheets/Code.gs google-sheets/Code_GMAC_V35.gs google-sheets/code-v35.part1 google-sheets/code-v35.part2
          if git diff --cached --quiet; then
            echo "Format engine already up to date."
            exit 0
          fi
          git commit -m "V42: fix Eurocopa thirds and league playoff seeding"
          git push
