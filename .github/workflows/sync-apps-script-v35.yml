name: Sync Apps Script V35

on:
  push:
    paths:
      - google-sheets/Code_GMAC_V35.gs.gz.b64

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode Apps Script source
        run: |
          python - <<'PY'
          import base64, gzip, pathlib
          root = pathlib.Path('google-sheets')
          raw = base64.b64decode((root / 'Code_GMAC_V35.gs.gz.b64').read_text().strip())
          source = gzip.decompress(raw)
          (root / 'Code.gs').write_bytes(source)
          (root / 'Code_GMAC_V35.gs').write_bytes(source)
          PY
      - name: Commit synchronized source
        run: |
          git config user.name "GMAC V35 Sync"
          git config user.email "actions@users.noreply.github.com"
          git add google-sheets/Code.gs google-sheets/Code_GMAC_V35.gs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V35: sync Apps Script admin backend"
          git push
