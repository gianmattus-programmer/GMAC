name: Apply GMAC Production SEO

on:
  push:
    paths:
      - scripts/apply-production-seo.mjs
      - .github/workflows/apply-production-seo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply production SEO
        run: node scripts/apply-production-seo.mjs
      - name: Commit SEO output
        run: |
          git config user.name "GMAC SEO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html fc-mobile.html efootball.html contacto.html torneo.html assets/js/tournaments/data.js robots.txt sitemap.xml
          if git diff --cached --quiet; then
            echo "SEO already up to date."
            exit 0
          fi
          git commit -m "SEO: optimize gmactorneos.lat for production"
          git push
